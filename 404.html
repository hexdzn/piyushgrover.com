<!DOCTYPE html>
<html lang="en" class="no-js" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Piyush Grover</title>
  <meta name="description" content="That page doesn't exist. Browse the work of Piyush Grover, Senior Product Designer.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0c0e" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f2f1ed" media="(prefers-color-scheme: light)">
  <link rel="icon" href="img/shared/Memoji1.png">
  <link rel="preload" href="fonts/Archivo-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/PlexMono-500.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/main.css">
  <script>
    (function () {
      var t; try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
      document.documentElement.classList.remove('no-js');

      /* Legacy Wix URLs. This domain served a Wix site before the rebuild, so
         these paths may still be linked or indexed. GitHub Pages can't issue a
         real 301, so this is a client-side redirect — imperfect for link equity
         but far better than dropping the visitor on a dead end. */
      var LEGACY = {
        'home': 'index.html',
        'about': 'about.html',
        'blank-3': 'about.html',
        'playground': 'playground.html',
        'blank-2': 'playground.html',
        'nbs': 'nbs.html',
        'blank-1-2': 'nbs-cass.html',
        'nbs-cass': 'nbs-cass.html',
        'blank-1': 'nbs-auth.html',
        'nbs-auth': 'nbs-auth.html',
        'blank-7': 'nbs-show-hide.html',
        'nbs-show-hide': 'nbs-show-hide.html',
        'blank-5': 'linkedin-commission.html',
        'linkedin-commission': 'linkedin-commission.html',
        'rapipay': 'rapipay.html',
        'shagunly': 'shagunly.html',
        'blank-6': 'index.html',
        'blog': 'index.html'
      };
      var slug = location.pathname.replace(/\/+$/, '').split('/').pop().toLowerCase();
      if (LEGACY.hasOwnProperty(slug)) location.replace(LEGACY[slug]);
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-head">
    <a class="brand" href="index.html"><img src="img/shared/Memoji1.png" alt="" width="30" height="30">Piyush Grover</a>
    <nav class="nav-links" aria-label="Primary">
      <a href="index.html">Work</a>
      <a href="playground.html">Not Work</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <section class="cs-hero">
      <div class="wrap">
        <p class="eyebrow">Error 404</p>
        <h1 class="display-xl">This page doesn&rsquo;t exist</h1>
        <p class="lede">The link may be out of date, or the page has moved since the site was rebuilt.</p>
        <div class="hero-cta-row" style="margin-top:2.5rem;">
          <a class="btn btn-solid" href="index.html">See the work <span class="arr">&rarr;</span></a>
          <a class="btn btn-ghost" href="about.html">About me <span class="arr">&rarr;</span></a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-foot">
    <div class="wrap foot-bottom">
      <span>&copy; <span data-year></span> Piyush Grover</span>
      <span>Designing fluid and functional interfaces</span>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
